---
##################################################
# Trivy Configuration
# https://trivy.dev/latest/docs/references/configuration/config-file/
# Read by the SecOps workflow (consumer-trivy, config-file: auto).
##################################################

scan:
  scanners:
    - vuln
    - misconfig
    - secret
    - license

  severity:
    - CRITICAL
    - HIGH
    - MEDIUM

  skip-dirs:
    - .devenv
    - .direnv
    - .git
    # Generated by `build` and `generate`; ignored by Git.
    - public
    - static/pagefind

  skip-files:
    - "*.nix"
    - "devenv.lock"

vulnerability:
  ignore-unfixed: true
