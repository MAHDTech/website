##################################################
# Name: wrangler.toml
# Description: Cloudflare Workers Static Assets config
##################################################

name = "website-mahdtech"
account_id = "6d6a8fb1f9f3f38b7374d4974c0743cf"
workers_dev = false
compatibility_date = "2026-01-01"
logpush = false

[assets]
directory = "./public"
not_found_handling = "404-page"

[env.staging]
routes = [
  { pattern = "staging.mahdtech.com", custom_domain = true },
  { pattern = "staging.mahdtech.com/*", zone_name = "mahdtech.com" },
]

[env.production]
routes = [
  { pattern = "www.mahdtech.com", custom_domain = true },
  { pattern = "www.mahdtech.com/*", zone_name = "mahdtech.com" },
  { pattern = "mahdtech.com", custom_domain = true },
  { pattern = "mahdtech.com/*", zone_name = "mahdtech.com" },
]
