# Site configuration for https://mahdtech.com
# Personal details (name, email, links) live in data/resume.yaml, not here.
base_url = "https://mahdtech.com"
title = "MAHDTech"
description = "Writing and resume of a platform engineer working on Kubernetes, immutable infrastructure, Rust, NixOS and AI harness engineering."
default_language = "en"

compile_sass = false
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]

taxonomies = [
  { name = "tags", feed = true },
  { name = "categories", feed = true },
]

[markdown]
render_emoji = true
external_links_target_blank = true
external_links_no_follow = false
external_links_no_referrer = true
smart_punctuation = false

[markdown.highlighting]
error_on_missing_language = true
theme = "one-dark-pro"

[extra]
subtitle = "MAHD about tech"
repository_url = "https://github.com/MAHDTech/website"
# GitHub repository whose issues hold blog post comments (see extra.github_issue_id).
github_repo = "MAHDTech/website"
logo_path = "/images/logo.svg"
# Tag and keyword filters appear on the blog index once there are this many posts.
blog_filter_min_posts = 10

# `also_active` lists extra path prefixes that highlight the item as current.
[[extra.menu_items]]
name = "Blog"
url = "/"
also_active = ["/posts/", "/tags/", "/categories/"]

[[extra.menu_items]]
name = "Resume"
url = "/resume/"

