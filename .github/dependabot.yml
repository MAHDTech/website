---
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "00:00"
      timezone: "Australia/Sydney"
    assignees:
      - "MAHDTech"
    labels:
      - "dependencies"
      - "dependabot"
      - "actions"
    target-branch: "trunk"
    commit-message:
      prefix: "ci"
    rebase-strategy: "auto"
    open-pull-requests-limit: 5
