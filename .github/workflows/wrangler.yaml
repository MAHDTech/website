---
name: Wrangler

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
    types:
      - opened
      - reopened
      - synchronize
      - review_requested

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

defaults:
  run:
    shell: bash

env:
  WRANGLER_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
  BRANCH_NAME_CURRENT: ${{ github.head_ref || github.ref_name }}
  BRANCH_NAME_DEFAULT: ${{ github.event.repository.default_branch }}

jobs:
  deploy:
    name: Build and publish website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: checkout_repository
        name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: true

      - id: install_nix
        name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
            substituters = https://cache.nixos.org https://devenv.cachix.org

      - id: install_devenv
        name: Install devenv
        run: nix profile install nixpkgs#devenv

      - id: build_staging
        name: Build website (Staging)
        if: env.BRANCH_NAME_CURRENT != env.BRANCH_NAME_DEFAULT
        env:
          CI: "true"
          TZ: "Australia/Sydney"
        run: |
          devenv --no-tui shell --quiet -- bash -c '
            if [ ! -f static/fonts/Inter-Variable.woff2 ] || [ ! -f static/fonts/JetBrainsMono-Variable.woff2 ]; then
              fonts
            fi
            resumes
            css
            zola check
            zola build --base-url https://staging.mahdtech.com
            pagefind --site public
          '

      - id: build_production
        name: Build website (Production)
        if: env.BRANCH_NAME_CURRENT == env.BRANCH_NAME_DEFAULT
        env:
          CI: "true"
          TZ: "Australia/Sydney"
        run: |
          devenv --no-tui test

      - id: publish_website_staging
        name: Publish website using Wrangler (Staging)
        if: |
          env.BRANCH_NAME_CURRENT != env.BRANCH_NAME_DEFAULT &&
          steps.build_staging.outcome == 'success'
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          environment: staging
          apiToken: ${{ env.WRANGLER_API_TOKEN }}
          command: deploy --env staging

      - id: publish_website_production
        name: Publish website using Wrangler (Production)
        if: |
          env.BRANCH_NAME_CURRENT == env.BRANCH_NAME_DEFAULT &&
          steps.build_production.outcome == 'success'
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          environment: production
          apiToken: ${{ env.WRANGLER_API_TOKEN }}
          command: deploy --env production

  check:
    name: PR Status Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    steps:
      - name: PR Status Giphy
        id: pr-status-giphy
        uses: dgteixeira/pr-status-giphy-action@v2
        if: github.event_name == 'pull_request'
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
