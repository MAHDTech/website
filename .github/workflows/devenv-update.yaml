---
name: Devenv Update

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch: {}

concurrency:
  group: devenv-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update Devenv Dependencies
    uses: tars-cloud/actions/.github/workflows/consumer-devenv-update.yaml@253eb09c3b4249a2f4adb70f8a6e87203129e4e2 # v3.15.0
    secrets:
      client-id: ${{ secrets.APP_CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
