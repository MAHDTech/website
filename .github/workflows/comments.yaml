---
name: Comments

on:
  issue_comment:
    types:
      - created
      - edited

defaults:
  run:
    shell: bash

permissions:
  contents: read
  issues: write

jobs:
  giphy:
    name: Giphy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: giphy
        name: Giphy image search
        uses: IAmHughes/giphy-generator@v1.0.0
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GIPHY_TOKEN: "${{ secrets.GIPHY_TOKEN }}"
        with:
          rating: "PG-13"
          lang: "en"

  discord:
    name: Discord
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post message to Discord
        id: discord_message
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_DISCORD }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          REPO_NAME: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          MESSAGE="The ${EVENT_NAME} event was triggered in the ${REPO_NAME} repository. The comment is available to view [here](${COMMENT_URL})"
          JSON_CONTENT=$(jq -n --arg content "@CI ${MESSAGE}" '$ARGS.named')
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "${JSON_CONTENT}" \
            "${WEBHOOK_URL}"
