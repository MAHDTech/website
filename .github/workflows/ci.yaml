---
name: CI

# Pull requests only: Deploy runs the same `devenv test` on trunk before publishing.
on:
  pull_request:
    branches:
      - trunk
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: CI Validation
    uses: tars-cloud/actions/.github/workflows/devenv-ci.yaml@e237e0ca8fbf31df927e9418d6b94dd81a462a35 # v4.0.0
    with:
      job-name: validate
      # `devenv test` already runs every hook in its git-hooks:run task.
      lint-command: ""
