{% extends "base.html" %}

{% block content %}
<div class="space-y-8">
  {{ <ui.section_header eyebrow="DISPATCH ARCHIVE" title={section.title | default(value="All Dispatches")} summary={section.description | default(value="")} eyebrow_variant="cyan" /> }}

  {% if section.pages and section.pages | length > 0 %}
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      {% for post in section.pages %}
        {{ <ui.blog_card post={post} featured={false} eager_image={loop.first} /> }}
      {% endfor %}
    </div>
  {% endif %}
</div>
{% endblock %}
