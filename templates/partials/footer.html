{% set resume_data = load_data(path="data/resume.yaml") %}{% set person =
resume_data.basics %}
<footer class="site-footer border-t border-border bg-surface-raised mt-auto">
    <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col md:flex-row items-start md:items-center justify-between gap-6"
    >
        <div class="flex items-center gap-3.5">
            <img
                src="{{ config.extra.logo_path }}"
                alt=""
                width="30"
                height="30"
                class="w-7.5 h-7.5 opacity-95"
            />
            <div>
                <p class="text-sm text-text-primary">
                    <span class="font-mono font-bold tracking-tight"
                        >{{ config.title }}</span
                    >
                    <span class="text-text-muted"> · {{ person.name }}</span>
                </p>
                <p class="text-xs text-text-muted mt-0.5">
                    Screaming into /dev/null
                </p>
            </div>
        </div>

        <nav
            aria-label="Footer"
            class="flex flex-wrap items-center gap-5 text-sm text-text-muted"
        >
            {% for item in config.extra.menu_items %}
            <a
                href="{{ item.url | safe }}"
                class="hover:text-accent-cyan transition-colors"
                >{{ item.name }}</a
            >
            {% endfor %}
            <a
                href="{{ get_url(path='atom.xml', trailing_slash=false) | safe }}"
                class="hover:text-accent-cyan transition-colors"
                >Atom feed</a
            >
            <a href="/llms.txt" class="hover:text-accent-cyan transition-colors"
                >llms.txt</a
            >
            <a
                href="{{ person.github_url | safe }}"
                target="_blank"
                rel="noopener noreferrer"
                class="hover:text-accent-cyan transition-colors"
                >GitHub <span aria-hidden="true">↗</span></a
            >
        </nav>
    </div>
</footer>
