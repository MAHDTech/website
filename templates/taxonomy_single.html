{% extends "base.html" %}

{% block content %}
<div class="space-y-8">
  <div class="flex items-center justify-between gap-4">
    <a href="/" class="font-mono text-xs text-accent-cyan hover:underline">&lt;- Back to all dispatches</a>
    <span class="status-chip tabular-nums">{{ term.pages | length }} ENTRIES</span>
  </div>

  {{ <ui.section_header eyebrow="TOPIC FILTER" title={"#" ~ term.name} summary={"Dispatches tagged with " ~ term.name ~ "."} eyebrow_variant="violet" /> }}

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for post in term.pages %}
      {{ <ui.blog_card post={post} featured={false} eager_image={loop.first} /> }}
    {% endfor %}
  </div>
</div>
{% endblock %}
