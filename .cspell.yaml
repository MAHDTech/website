---
$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: "0.2"
# Both spellings are accepted: posts and the resume mix UK and US English.
language: en-GB,en-US
dictionaryDefinitions:
  - name: project-words
    path: ./project-words.txt
    addWords: true
dictionaries:
  - en-gb
  - en_us
  - project-words
useGitignore: true
ignorePaths:
  - .devenv
  - .direnv
  - .git
  - .pre-commit-config.yaml
  - devenv.lock
  - devenv.nix
  - node_modules
  - project-words.txt
  # Generated by the `css` and `fonts` scripts.
  - static/css/custom.css
  - static/fonts
  - "*.drawio"
  - "*.gif"
  - "*.png"
  - "*.svg"
ignoreRegExpList:
  - /-----BEGIN PGP PUBLIC KEY BLOCK-----[\s\S]*?-----END PGP PUBLIC KEY BLOCK-----/
  - /\b([a-z0-9]{5}-)+[a-z0-9]{1,5}\b/
  # Pinned commit SHAs in GitHub Actions.
  - /@[0-9a-f]{40}\b/
  # GitHub node IDs, such as the Giscus repo and category IDs in config.toml.
  - /\b[A-Z]+_k[a-zA-Z]DO[\w-]+/
  # Bold-initial acronyms in posts, such as "**G**ather".
  - /\*\*[A-Z]\*\*[a-z]+/
