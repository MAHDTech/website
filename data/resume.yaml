---
# The single source of truth for the resume.
# Rendered by:
#   templates/resume.html  -> /resume/ (web)
#   resume/resume.typ      -> Full and Short PDFs
#   resume/og.typ          -> social preview cards
#   resume/*.jq            -> /resume.json, /resume.md, /llms.txt
# Dates are "YYYY-MM"; an empty `end` means the role is current.
# Add `hidden: true` to a role to keep it here but leave it out of every
# rendered output (it defaults to false, so roles are shown unless marked).
# Years of experience and role counts are computed from visible `experience`,
# and "{years}" inside prose is replaced with that computed value.

basics:
  name: "Matthew Duncan"
  handle: "MAHDTech"
  title: "Platform Engineer"
  subtitle: "Platform, SRE & AI Harness Engineer"
  location: "Canberra, Australia (APAC)"
  email: "matthew.duncan@mahdtech.com"
  github: "MAHDTech"
  github_url: "https://github.com/MAHDTech"
  website: "https://mahdtech.com"
  # Optional availability line shown above your name; leave empty to hide.
  status: "Freelance Contractor"

# Qualitative highlights shown next to the computed experience metrics.
highlights:
  - value: "Multi-cloud"
    label: "Hardened K8s & IaC"
    detail: "AWS, Azure, Nutanix, Tanzu, Talos & air-gapped"

  - value: "Rust + AI"
    label: "Agentic tooling"
    detail: "GUARDS AI harness, vLLM/Candle inference on Kubernetes"

profile:
  executive_summary: >-
    Senior Platform & Site Reliability Engineer with {years}+ years of experience architecting
    hardened Kubernetes platforms, multi-cloud Infrastructure as Code (AWS, Azure, Nutanix,
    VMware), and GitOps automation across high-compliance federal and enterprise environments.
    Creator of Rust platform tooling, immutable Talos/NixOS infrastructure, and deterministic
    AI software harnesses (GUARDS) paired with Kubernetes LLM inference.
  statements:
    - category: "Multi-Cloud & IaC"
      text: >-
        Site Reliability Engineer (SRE) / Platform Engineer specialized in Automation and
        Infrastructure as Code with a track record of managing multi-cloud environments
        (AWS, Azure, Nutanix).
    - category: "Orchestration & Hardening"
      text: >-
        Deep expertise in Kubernetes orchestration, CI/CD pipelines, GitOps, and system
        hardening.
    - category: "Edge & Systems"
      text: >-
        Actively bridging the gap between Web2 and Web3 by developing high-performance edge
        solutions using Rust, Motoko (ICP), and Cloudflare Workers.
    - category: "Open Source & NixOS"
      text: >-
        Committed to open-source innovation, with active contributions in NixOS flakes,
        tooling, secure container images, and AI-driven chatbots.
    - category: "Operational Excellence"
      text: >-
        Dedicated to reducing operational toil and optimizing cost-efficiency through
        rigorous engineering standards.
    - category: "AI Harness Engineering"
      text: >-
        Experience in AI Harness Engineering running Inference platforms and the creation
        of a custom AI harness utilizing the GUARDS framework.

# PDF editions generated by the `resumes` devenv script (served from /resume/).
downloads:
  full:
    label: "Full resume"
    sublabel: "Every role in detail, with achievements, notes and tech stacks"
    filename: "Matthew-Duncan-Resume-Full.pdf"
  short:
    label: "Short resume"
    sublabel: "One-page overview for quick screening"
    filename: "Matthew-Duncan-Resume-Short.pdf"

